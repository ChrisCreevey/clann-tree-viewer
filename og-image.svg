<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Helvetica, Arial, sans-serif">
  <!-- palette: bg #FAF6EE, ink #1A160F, muted #6A5A43, branch #4B4031, clay(dup) #A94B2E, teal #0B7268, loss #B7A283 -->
  <rect width="1200" height="630" fill="#FAF6EE"/>
  <rect width="1200" height="12" fill="#A94B2E"/>

  <!-- wordmark -->
  <text x="84" y="176" font-size="58" font-weight="700" letter-spacing="1.5" fill="#A94B2E">CLANN TREE VIEWER</text>

  <!-- tagline + formats -->
  <text x="86" y="250" font-size="40" font-weight="600" fill="#1A160F">Phylogenetic tree viewer</text>
  <text x="86" y="298" font-size="26" font-family="Menlo, Consolas, monospace" fill="#0B7268">Newick &#183; NEXUS &#183; NHX &#8212; in your browser</text>

  <!-- feature lines -->
  <text x="86" y="352" font-size="23" fill="#6A5A43">reroot &#183; collapse &#183; colour &#183; rename &#183; midpoint root</text>
  <text x="86" y="386" font-size="23" fill="#6A5A43">cladogram &#183; phylogram &#183; radial &#183; export SVG/PNG/PDF</text>

  <!-- reconciliation callout -->
  <text x="86" y="452" font-size="29" font-weight="700" fill="#1A160F">Gene-tree reconciliations</text>
  <g font-size="23" fill="#1A160F">
    <rect x="88" y="475" width="19" height="19" fill="#A94B2E"/>
    <text x="116" y="491">duplications</text>
    <circle cx="285" cy="485" r="9.5" fill="#4B4031"/>
    <text x="303" y="491">speciations</text>
    <text x="470" y="493" font-size="24" font-weight="700" fill="#B7A283">&#10005;</text>
    <text x="493" y="491">losses</text>
  </g>

  <!-- footer -->
  <text x="86" y="560" font-size="22" fill="#8E7A5E">Free &#183; open source &#183; nothing is uploaded &#183; creeveylab.org</text>

  <!-- ===== tree illustration (aligned cladogram with a reconciliation event) ===== -->
  <!-- black clade: root bar + (A,B) -->
  <g stroke="#4B4031" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M730,145 V355"/>            <!-- root vertical bar -->
    <path d="M730,145 H990"/>            <!-- root -> (A,B) node -->
    <path d="M990,110 V180"/>            <!-- (A,B) bar -->
    <path d="M990,110 H1120"/><path d="M990,180 H1120"/>
  </g>
  <!-- coloured (teal) clade below a duplication node -->
  <g stroke="#0B7268" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M730,355 H860"/>            <!-- root -> duplication node -->
    <path d="M860,285 V425"/>            <!-- dup node bar -->
    <path d="M860,285 H990"/><path d="M860,425 H990"/>
    <path d="M990,250 V320"/>            <!-- (C,D) bar -->
    <path d="M990,250 H1120"/><path d="M990,320 H1120"/>
    <path d="M990,390 V460"/>            <!-- (E,F) bar -->
    <path d="M990,390 H1120"/><path d="M990,460 H1120"/>
  </g>
  <!-- loss: dashed stub off the duplication node, ending in an X -->
  <path d="M860,355 H985" stroke="#B7A283" stroke-width="3" stroke-dasharray="5 5" fill="none"/>
  <text x="992" y="363" font-size="26" font-weight="700" fill="#B7A283">&#10005;</text>

  <!-- speciation node dots (circles) -->
  <g fill="#4B4031"><circle cx="730" cy="250" r="6.5"/><circle cx="990" cy="145" r="5.5"/></g>
  <g fill="#0B7268"><circle cx="990" cy="285" r="5.5"/><circle cx="990" cy="425" r="5.5"/></g>
  <!-- duplication node (clay square) -->
  <rect x="851" y="346" width="18" height="18" fill="#A94B2E"/>
  <!-- tip dots -->
  <g fill="#1A160F">
    <circle cx="1120" cy="110" r="5"/><circle cx="1120" cy="180" r="5"/>
    <circle cx="1120" cy="250" r="5"/><circle cx="1120" cy="320" r="5"/>
    <circle cx="1120" cy="390" r="5"/><circle cx="1120" cy="460" r="5"/>
  </g>
</svg>
